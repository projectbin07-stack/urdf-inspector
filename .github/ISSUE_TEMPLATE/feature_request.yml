name: Feature request
description: Suggest a check, a view or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which URDF mistake would you like caught, or what would you like to see?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Where the rule comes from (URDF specification, a REP, urdfdom, kdl_parser, sdformat, ros2_control documentation) or how the tool behaves with the mistake.
  - type: textarea
    id: example
    attributes:
      label: Minimal failing and passing URDF
      render: xml
