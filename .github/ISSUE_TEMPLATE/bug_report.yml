name: Bug report
description: A wrong or missing finding, a URDF that will not load, a crash, or something broken in the app or the CLI
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw and what you expected. For a wrong finding, say why you think it is wrong (what RViz, Gazebo, ros2_control or check_urdf do with the same file).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal URDF
      description: The smallest URDF that shows the problem (after xacro). Do not paste models you are not allowed to share.
      render: xml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `urdf-inspector --version`, or the commit hash of the page.
  - type: input
    id: environment
    attributes:
      label: Browser or Node version, and OS
